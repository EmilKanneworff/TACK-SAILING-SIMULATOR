<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TACK · Bådenes størrelse</title><style>html,body{margin:0;height:100%;background:#102f3c;color:#fff;font:15px system-ui}iframe{width:100%;height:100%;border:0}header{position:fixed;z-index:2;top:0;left:0;padding:18px 24px;background:#102f3ce6;border-radius:0 0 12px 0}header strong{display:block;margin-bottom:4px}a{color:#9ce2d4}</style></head><body><header><strong>Samme skala</strong>Laserjolle · 4,23 m &nbsp; / &nbsp; Racer 27 · 8,23 m &nbsp; / &nbsp; Turbåd 43 · 13,1 m<br><a href="../">Tilbage til spillet</a></header><iframe id="game" src="../" title="Bådene vist i samme skala"></iframe><script>
const frame=document.getElementById('game');frame.addEventListener('load',()=>{const win=frame.contentWindow,doc=frame.contentDocument;const begin=()=>{const game=win.SAILING_GAME;if(!game){setTimeout(begin,100);return}doc.querySelector('#startButton').click();const style=doc.createElement('style');style.textContent='.hud,#intro,.modal-layer,.toast,.coach,.sailing-dock,#downwindControls{display:none!important}';doc.head.append(style);const scene=game.scene,env=game.env,local=game.state;const boats=[{scene,state:local,y:-13}];for(const [id,y] of [['dinghy',0],['yacht',13]]){const actor=Object.create(scene);actor.boatRoot=null;actor.boatId=null;actor.configureWaterMask=()=>{};actor.updateWaterMask=()=>{};actor.buildBoat(id);boats.push({scene:actor,state:win.SailPhysics.createState({boatId:id,x:0,y,theta:0},{...env,boatId:id}),y})}function draw(){for(const b of boats){b.state.x=0;b.state.y=b.y;b.state.theta=0;b.scene.updateBoat(b.state,env,0)}scene.camera.position.set(39,24,55);scene.camera.zoom=1.6;scene.camera.lookAt(0,7,0);scene.camera.updateProjectionMatrix();scene.renderer.render(scene.scene,scene.camera);win.requestAnimationFrame(draw)}draw()};begin()});
